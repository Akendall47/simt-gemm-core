<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#ffffff"/>

  <!-- core boundary -->
  <rect x="20" y="20" width="560" height="350" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="6 4"/>
  <text x="36" y="42" font-weight="bold" fill="#57606a">SIMT GEMM Core (SystemVerilog)</text>

  <g fill="#ffffff" stroke="#0969da" stroke-width="1.5">
    <rect x="40"  y="60" width="110" height="46" rx="6"/>
    <rect x="175" y="60" width="100" height="46" rx="6"/>
    <rect x="300" y="60" width="100" height="46" rx="6"/>
    <rect x="425" y="60" width="135" height="46" rx="6"/>
    <rect x="40"  y="140" width="160" height="46" rx="6"/>
    <rect x="230" y="140" width="190" height="46" rx="6"/>
    <rect x="40"  y="300" width="520" height="46" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1f2328">
    <text x="95"  y="88">Program mem</text>
    <text x="225" y="88">Fetch</text>
    <text x="350" y="88">Decode</text>
    <text x="492" y="88">Warp scheduler</text>
    <text x="120" y="168">Block dispatcher</text>
    <text x="325" y="160">Warp state (per warp)</text>
    <text x="325" y="177" font-size="12" fill="#57606a">PC · block id · waiting?</text>
    <text x="300" y="328">Load / store unit</text>
  </g>

  <!-- lanes -->
  <rect x="40" y="215" width="520" height="62" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#54aeff">
    <rect x="52"  y="225" width="117" height="42" rx="5"/>
    <rect x="179" y="225" width="117" height="42" rx="5"/>
    <rect x="306" y="225" width="117" height="42" rx="5"/>
    <rect x="433" y="225" width="117" height="42" rx="5"/>
  </g>
  <g text-anchor="middle" fill="#1f2328">
    <text x="110" y="243" font-weight="bold">Lane 0</text><text x="110" y="260" font-size="12" fill="#57606a">regs · ALU · DOT4</text>
    <text x="237" y="243" font-weight="bold">Lane 1</text><text x="237" y="260" font-size="12" fill="#57606a">regs · ALU · DOT4</text>
    <text x="364" y="243" font-weight="bold">Lane 2</text><text x="364" y="260" font-size="12" fill="#57606a">regs · ALU · DOT4</text>
    <text x="491" y="243" font-weight="bold">Lane 3</text><text x="491" y="260" font-size="12" fill="#57606a">regs · ALU · DOT4</text>
  </g>

  <!-- arrows -->
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M150,83 H172"/>
    <path d="M275,83 H297"/>
    <path d="M400,83 H422"/>
    <path d="M200,163 H227"/>
    <path d="M420,163 H470 V109"/>
    <path d="M520,106 V212"/>
    <path d="M300,277 V297"/>
    <path d="M300,346 V397"/>
    <path d="M330,397 V349"/>
  </g>
  <text x="340" y="380" font-size="12" fill="#57606a">valid / ready</text>

  <!-- memory -->
  <rect x="150" y="400" width="300" height="56" rx="6" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
  <text x="300" y="424" text-anchor="middle" font-weight="bold" fill="#1f2328">Global memory (C++ model)</text>
  <text x="300" y="443" text-anchor="middle" font-size="12" fill="#57606a">latency N cycles · counts requests</text>
</svg>
